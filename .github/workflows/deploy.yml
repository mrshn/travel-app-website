name: Deploy

# The app has one home: Firebase Hosting, https://travela-emre.firebaseapp.com
# (travela-emre.web.app forwards there). Every push to main tests and builds the site,
# then deploys it with the Firestore and Storage security rules.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

# One deploy at a time. A deploy that has started always finishes; a newer push waits for it,
# then deploys (only the newest waiting push runs).
concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Unit tests
        run: npm test

      - name: Type check
        run: npm run typecheck

      - name: Build the static site
        run: npm run generate
        env:
          NUXT_APP_BASE_URL: /

      # Keyless: GitHub proves it's this repository, Google lets it act as the deploy account.
      - uses: google-github-actions/auth@v3
        with:
          project_id: travela-emre
          workload_identity_provider: projects/954018683436/locations/global/workloadIdentityPools/github/providers/github-repo
          service_account: github-deploy@travela-emre.iam.gserviceaccount.com

      - name: Deploy the site and the security rules
        run: npx -y firebase-tools@15 deploy --only hosting,firestore:rules,storage --project travela-emre --non-interactive
